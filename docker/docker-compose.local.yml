version: '3.8'

services:
  # 1. PostgreSQL Mahalliy Ma'lumotlar Bazasi (Ixtiyoriy, agar SQLite o'rniga Postgres ishlatilsa)
  postgres:
    image: postgres:16-alpine
    container_name: oshxona_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oshxona_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ni .env da o'rnating}
      POSTGRES_DB: ${POSTGRES_DB:-oshxona_pos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Local Server (NestJS Kassa & Oshxona API)
  local-server:
    build:
      context: ..
      dockerfile: apps/local-server/Dockerfile
    container_name: oshxona_local_server
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: "postgresql://${POSTGRES_USER:-oshxona_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oshxona_pos}?schema=public"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET ni .env da o'rnating}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET ni .env da o'rnating}"
      JWT_ACCESS_EXPIRATION: "15m"
      JWT_REFRESH_EXPIRATION: "7d"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3001}"
      CORS_ALLOW_PRIVATE_LAN: "${CORS_ALLOW_PRIVATE_LAN:-true}"
      CLOUD_API_URL: "${CLOUD_API_URL:-}"
      CLOUD_SYNC_API_KEY: "${CLOUD_SYNC_API_KEY:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    volumes:
      - local_server_data:/app/apps/local-server/data
      - local_server_backups:/app/apps/local-server/backups
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Admin Web & KDS Ekran (Next.js 15)
  admin-web:
    build:
      context: ..
      dockerfile: apps/admin-web/Dockerfile
    container_name: oshxona_admin_web
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      # NEXT_PUBLIC_API_URL build vaqtida kiritiladi. Bo'sh bo'lsa brauzer ochgan host:4000 ishlatiladi
      # (LAN dagi KDS/planshetlar uchun to'g'ri).
    depends_on:
      - local-server

volumes:
  postgres_data:
  local_server_data:
  local_server_backups:
